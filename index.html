<!DOCTYPE html>
<html>
<head>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8e9196}
  svg{width:100%;height:100%;display:block;overflow:visible}
</style>
</head>
<body>
<svg viewBox="0 0 900 575" preserveAspectRatio="xMidYMid meet">
  <!-- back wall -->
  <rect x="-1000" y="-1000" width="2800" height="1340" fill="#b9bcc0"/>
  <!-- floor -->
  <rect x="-1000" y="340" width="2800" height="1000" fill="#8e9196"/>
  <rect x="-1000" y="334" width="2800" height="10" fill="#6f7277"/>
  <g stroke="#82858a" stroke-width="2">
    <line x1="-1000" y1="400" x2="1800" y2="400"/>
    <line x1="-1000" y1="470" x2="1800" y2="470"/>
  </g>
  <!-- right side wall, sign, cow corner -->
  <rect x="886" y="-1000" width="1200" height="1346" fill="#a3a6ab"/>
  <line x1="886" y1="-1000" x2="886" y2="345" stroke="#8d9095" stroke-width="3"/>
  <g transform="translate(832,170)">
    <rect x="-52" y="-22" width="104" height="44" rx="6" fill="#fff" stroke="#c1403d" stroke-width="3"/>
    <text y="-4" text-anchor="middle" font-size="14" font-weight="800" font-family="system-ui,sans-serif" fill="#c1403d">COW CORNER</text>
    <text y="14" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="#444">keep out!</text>
  </g>
  <g id="dung">
    <ellipse cx="790" cy="424" rx="18" ry="6" fill="#3f4a1f"/>
    <ellipse cx="790" cy="418" rx="14" ry="5.5" fill="#4f5b2a"/>
    <ellipse cx="790" cy="412" rx="9" ry="4.5" fill="#5d6b32"/>
    <path d="M787 408 Q792 402 789 398 Q795 403 794 408 Z" fill="#6e7d3c"/>
  </g>
  <!-- whiteboard -->
  <rect x="140" y="50" width="520" height="230" rx="6" fill="#9a9da2"/>
  <rect x="150" y="60" width="500" height="210" rx="3" fill="#fdfdfd"/>
  <rect x="150" y="270" width="500" height="10" fill="#8a8d92"/>
  <g font-family="cursive" font-size="30">
    <text x="410" y="105" fill="#2e6bd6">Welcome to class!</text>
    <text x="410" y="160" fill="#d64545">2 + 3 = 5</text>
    <text id="wbText" x="410" y="220" fill="#6a4fb3">Writing...</text>
  </g>
  <!-- UI Text Dashboard -->
  <text x="10" y="22" font-size="14" font-weight="700" font-family="sans-serif" fill="#2b2d42">Press Q: Throw Hummus | Press E: Drop Poop</text>
  <text id="count" x="10" y="45" font-size="14" font-family="sans-serif" fill="#41434f">Hummus: 0 | Poop: 0</text>
  <text id="scoreBase" x="400" y="35" font-size="28" font-weight="900" font-family="sans-serif" fill="#2b2d42" text-anchor="middle">Score: 0</text>
  <!-- Strikes -->
  <g id="strikes" font-family="sans-serif">
    <text x="548" y="35" font-size="12" font-weight="800" text-anchor="end" fill="#2b2d42">SEEN</text>
    <circle id="st1" cx="568" cy="30" r="10" fill="none" stroke="#2b2d42" stroke-width="2.5"/>
    <circle id="st2" cx="596" cy="30" r="10" fill="none" stroke="#2b2d42" stroke-width="2.5"/>
    <circle id="st3" cx="624" cy="30" r="10" fill="none" stroke="#2b2d42" stroke-width="2.5"/>
  </g>
  <!-- Desks & Kids -->
  <defs>
    <g id="desk">
      <rect x="8" y="20" width="7" height="42" fill="#6e7075"/><rect x="85" y="20" width="7" height="42" fill="#6e7075"/>
      <rect x="0" y="14" width="100" height="8" fill="#a9743f"/><polygon points="10,0 90,0 100,14 0,14" fill="#d49a5c"/>
    </g>
    <g id="kid"><rect x="20" y="-9" width="40" height="52" rx="13" fill="currentColor"/><circle cx="50" cy="-25" r="17" fill="#5a3b1e"/></g>
  </defs>
  <use href="#desk" transform="translate(55,405)"/><use href="#desk" transform="translate(165,405)"/><use href="#desk" transform="translate(400,405)"/>
  <g transform="translate(55,405)"><use href="#kid" color="#6a4fb3"/></g>
  <g transform="translate(165,405)"><use href="#kid" color="#3e9c6a"/></g>
  <!-- teacher's area -->
  <g id="tDesk">
    <rect x="560" y="385" width="200" height="14" fill="#a9743f"/>
    <rect x="570" y="399" width="10" height="70" fill="#8a5c30"/><rect x="740" y="399" width="10" height="70" fill="#8a5c30"/>
  </g>
  <g id="teacher" transform="translate(630,280)">
    <circle cx="30" cy="30" r="20" fill="#ffdbac"/>
    <rect id="tBody" x="10" y="50" width="40" height="60" fill="#4a69bd"/>
  </g>
</svg>

<script>
  let score = 0; let strikes = 0; let hummus = 0; let poop = 0; let isLooking = false;

  function loopTeacher() {
    isLooking = !isLooking;
    document.getElementById("tBody").style.fill = isLooking ? "#c1403d" : "#4a69bd";
    document.getElementById("wbText").textContent = isLooking ? "WATCHING!" : "Writing...";
    setTimeout(loopTeacher, 1500 + Math.random() * 2500);
  }

  window.addEventListener("keydown", (e) => {
    let key = e.key.toLowerCase();
    if (key === 'q') {
      if (isLooking) {
        strikes++; updateStrikes();
      } else {
        score += 25; hummus++; updateUI();
      }
    }
    if (key === 'e') {
      if (isLooking) {
        strikes++; updateStrikes();
      } else {
        score += 10; poop++; updateUI();
      }
    }
  });

  function updateUI() {
    document.getElementById("scoreBase").textContent = "Score: " + score;
    document.getElementById("count").textContent = `Hummus: ${hummus} | Poop: ${poop}`;
  }

  function updateStrikes() {
    if (strikes <= 3) document.getElementById(`st${strikes}`).style.fill = "#c1403d";
    if (strikes >= 3) {
      alert("Sent to the Dean's office! Game Over.");
      score = 0; strikes = 0; hummus = 0; poop = 0;
      updateUI();
      for(let i=1; i<=3; i++) document.getElementById(`st${i}`).style.fill = "none";
    }
  }
  setTimeout(loopTeacher, 2000);
</script>
</body>
</html>
