    else if(k==='w'||k==='a'||k==='s'||k==='d'){keys[k]=true;}
  });
  window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  window.addEventListener('message',function(e){
    var d=e.data;
    if(deanState){
      if(d==='space'){deanKey(' ');}
      else if(d==='restart'){deanKey('r');}
      else if(typeof d==='string'&&d.indexOf('ans:')===0){deanKey(d.slice(4));}
      return;
    }
    if(d==='throw'){throwIt();}else if(d==='poop'){makePoop();}else if(d==='restart'&&over){restart();}
    else if(d==='space'){spaceKey();}else if(d==='crouch'){toggleCrouch();}
    else if(typeof d==='string'&&d.indexOf('kd:')===0){keys[d.slice(3)]=true;}
    else if(typeof d==='string'&&d.indexOf('ku:')===0){keys[d.slice(3)]=false;}
  });
  window.addEventListener('pointerdown',function(){window.focus();if(over){restart();}});
  requestAnimationFrame(loop);
})();
</script>
