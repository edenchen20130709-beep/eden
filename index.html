      if(el>=500){alertG.setAttribute('visibility','hidden');tState='yelling';tT0=now;}
    }else if(tState==='warnBoard'||tState==='warnFront'){
      var wd=1000-450*sus,wv=Math.min(1,el/(wd-100));
      alertRect.setAttribute('y',198-46*wv);alertRect.setAttribute('height',46*wv);
      alertG.setAttribute('visibility','visible');
      if(el>=wd){alertG.setAttribute('visibility','hidden');tState=(tState==='warnBoard')?'toBoard':'toFront';tT0=now;}
    }else if(tState==='toBoard'){
      var u=el/450;
      if(u>=1){
        tState='writing';tT0=now;setFacing(true);
        if(feudKid>=0&&!over&&!caught&&!blameState&&!fightState){if(Math.random()<0.3){startFight(feudKid,now,now);}else{feudKid=-1;}}
        phrase=phrases[Math.floor(Math.random()*phrases.length)];
        typed=0;lastType=now;wbText.textContent='';writeEnd=now+(2200+Math.random()*2300)*(1-0.4*sus);
      }else{scx=Math.max(0.04,Math.abs(Math.cos(Math.PI*u)));setFacing(u>=0.5);}
    }else if(tState==='writing'){
      if(typed<phrase.length&&now-lastType>180){typed++;lastType=now;wbText.textContent=phrase.slice(0,typed);}
      var wx=Math.min(395,340+typed*13)+Math.sin(now*0.03)*3,wy=238+Math.sin(now*0.05)*4;
      wArm.setAttribute('x2',wx);wArm.setAttribute('y2',wy);
      wHand.setAttribute('cx',wx);wHand.setAttribute('cy',wy);
      if(now>=writeEnd){tState='warnFront';tT0=now;}
    }else if(tState==='noticing'){
      var h=46*Math.min(1,el/900);
      alertRect.setAttribute('y',198-h);alertRect.setAttribute('height',h);
      alertG.setAttribute('visibility','visible');
      if(el>=1100){tState='toFront';tT0=now;alertG.setAttribute('visibility','hidden');}
    }else if(tState==='toFront'){
      var v=el/450;
      if(v>=1){setFacing(false);if(caught){tState='yelling';tT0=now;}else{startActivity(now);}}
      else{scx=Math.max(0.04,Math.abs(Math.cos(Math.PI*v)));setFacing(v<0.5);}
    }else if(tState==='walk'){
      seen=Math.max(0,Math.min(1.2,seen+((inCorner&&!over&&now>=graceUntil)?edt:-edt*1.5)));
      if(seen>0){alertRect.setAttribute('y',198-46*seen/1.2);alertRect.setAttribute('height',46*seen/1.2);alertG.setAttribute('visibility','visible');}
      else{alertG.setAttribute('visibility','hidden');}
      var fxT=290+tx,fyT=465+ty;
      if(seen>=1.2){seen=0;catchPlayer('GET OUT OF THE COW CORNER!',now);}
      else{
        var wp=route[rIdx];
        if(wPhase===0){
          var ddx=wp.x-fxT,ddy=wp.y-fyT,dd=Math.sqrt(ddx*ddx+ddy*ddy),sp=100*edt;
          if(dd<=sp){
            tx=wp.x-290;ty=wp.y-465;wbob=0;
            if(wp.desk&&playerHidden&&Math.abs(pX-wp.x)<wp.hr&&!mini&&now>=miniImmune&&now>=graceUntil){startMini(now,'desk');}
            if(wp.wait>0){wPhase=1;waitUntil=now+wp.wait;bubble.textContent='Hmm…';bubbleUntil=waitUntil;}
            else{nextWp(now);}
          }else{tx+=ddx/dd*sp;ty+=ddy/dd*sp;wbob=-Math.abs(Math.sin(now*0.012))*3;}
        }else if(now>=waitUntil){nextWp(now);}
      }
    }else if(tState==='yelling'){
      var rd=Math.min(1,el/500);
      tRed.setAttribute('opacity',0.6*rd);tRedBody.setAttribute('opacity',0.4*rd);tAngry.setAttribute('opacity',rd);
      tMouth.setAttribute('ry',4+5*Math.abs(Math.sin(el*0.02)));
      yellEl.setAttribute('visibility','visible');
      yellEl.setAttribute('font-size',44+4*Math.sin(el*0.05));
      dx=Math.sin(now*0.09)*4;
      if(el>=1800){gameOver();}
    }
    if(flinchT0>=0){
      var w=(now-flinchT0)/450;
      if(w>=1){flinchT0=-1;}else{dx=Math.sin(w*38)*6*(1-w);rt=-9*Math.sin(w*Math.PI);}
    }
    if(tState!=='walk'){wbob=0;}
    var behind=(465+ty+wbob)<392;
    if(behind!==tBehind){tBehind=behind;teacher.parentNode.insertBefore(teacher,behind?rowBack:aF);}
    tsc=1+ty*0.0037;
    var base='translate('+(290+tx)+' '+(465+ty+wbob)+') scale('+tsc+') translate(-290 -465)';
    teacher.setAttribute('transform',base+' translate('+dx+' 0) rotate('+rt+' 290 465) translate(290 0) scale('+scx+' 1) translate(-290 0)');
    alertG.setAttribute('transform',base);bubble.setAttribute('transform',base);
  }
  function makePoop(){
    if(over||caught||riding){return;}
    if(standT>=1&&nearDoor()){useDoor(performance.now());return;}
    if(hasPoop||kBrew){return;}
    if(standT>=1&&dungReady&&Math.abs(pX-730)<(crouching?85:55)&&Math.abs(pY-590)<(crouching?66:40)){
      hasPoop=true;cowHeld=true;dungReady=false;dungAt=performance.now()+8000;dungHoldStart=performance.now();
      pop('Cow dung!',pX,pY-150*pS);return;
    }
    if(pooping){return;}
    pooping=true;poopT0=performance.now();keys.e=true;
  }
  window.addEventListener('keydown',function(e){
    if(e.key===' '){e.preventDefault();}
    if(e.repeat){return;}
    var k=e.key.toLowerCase();
    if(deanState){deanKey(k);return;}
    if(blameState){blameKey(k);return;}
    if(fightState){fightKey(k);return;}
    if(hallState){hallKey(k);return;}
    if(k==='q'){throwIt();}else if(k==='e'){makePoop();}else if(k==='r'&&over){restart();}else if(k==='f'){toggleCrouch();}
    else if(k===' '){spaceKey();}
    else if(k==='w'||k==='a'||k==='s'||k==='d'){keys[k]=true;}
  });
  window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  window.addEventListener('message',function(e){
    var d=e.data;
    if(hallState){
      if(d==='restart'){hallKey('r');}
      else if(d==='poop'){hallKey('e');}
      else if(d==='throw'){hallKey('q');}
      else if(typeof d==='string'&&d.indexOf('kd:')===0){hallKey(d.slice(3));}
      else if(typeof d==='string'&&d.indexOf('ku:')===0){keys[d.slice(3)]=false;}
      return;
    }
    if(fightState){
      if(typeof d==='string'&&d.indexOf('kd:')===0){fightKey(d.slice(3));}
      else if(d==='restart'){fightKey('r');}
      return;
    }
    if(blameState){
      if(typeof d==='string'&&d.indexOf('ans:')===0){blameKey(d.slice(4));}
      return;
    }
    if(deanState){
      if(d==='space'){deanKey(' ');}
      else if(d==='restart'){deanKey('r');}
      else if(typeof d==='string'&&d.indexOf('ans:')===0){deanKey(d.slice(4));}
      return;
    }
    if(d==='throw'){throwIt();}else if(d==='poop'){makePoop();}else if(d==='restart'&&over){restart();}
    else if(d==='space'){spaceKey();}else if(d==='crouch'){toggleCrouch();}
    else if(typeof d==='string'&&d.indexOf('kd:')===0){keys[d.slice(3)]=true;}
    else if(typeof d==='string'&&d.indexOf('ku:')===0){keys[d.slice(3)]=false;}
  });
  window.addEventListener('pointerdown',function(){window.focus();if(over){restart();}});
  requestAnimationFrame(loop);
})();
</script>
